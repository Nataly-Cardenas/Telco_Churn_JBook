# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "Modelo de Clasificación Binaria para la Predicción de Abandono de Clientes a partir de Datos de Suscripción: Dataset Telco Customer Churn"
author: Laura S. Rivera Figueredo y Natalý A. Cárdenas Izaquita
logo: Imagenes/logo.png

execute:
  execute_notebooks: "off"

# Solo los capítulos del índice: se excluyen entornos, resultados y documentos de trabajo
exclude_patterns:
  - ".book-env/*"
  - ".venv/*"
  - "_build/*"
  - "revision_tmp/*"
  - "experiments/*"
  - "catboost_info/*"
  - "_archivo_no_subir/*"
  - ".pytest_cache/*"
  - "EDA.ipynb"
  - "MODEL_CARD.md"
  - "DATA_STATEMENT.md"
  - "PENDIENTES_LAURA.md"

html:
  extra_css:
    - style/custom.css
  use_issues_button: true
  use_repository_button: true
  use_download_button: true
  use_edit_page_button: true

sphinx:
  config:
    html_theme_options:
      default_mode: "dark"
    html_extra_path:
      - paper/paper.pdf
      - paper/paper_regionalmapem.pdf
    html_static_path:
      - style
    html_css_files:
      - componentes.css
    bibtex_reference_style: author_year
  extra_extensions:
    - sphinx_design
    - sphinx_proof
  # Corrige el </div> de más que docutils 0.18 deja tras la bibliografía (ver _ext/arreglo_citas.py)
  local_extensions:
    arreglo_citas: _ext

favicon: Imagenes/favicon.ico

latex:
  latex_documents:
    targetname: book.tex

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/Nataly-Cardenas/Telco_Churn_JBook
  branch: main